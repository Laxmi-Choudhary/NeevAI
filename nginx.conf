server {
    listen 8080;
    include /etc/nginx/mime.types;
    root /usr/share/nginx/html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API Proxy
    location /api/ {
        proxy_pass https://neevai-backend-294690858332.asia-south1.run.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host neevai-backend-294690858332.asia-south1.run.app;
    }

    # Static Assets - strict 404 if not found
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else falls back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

